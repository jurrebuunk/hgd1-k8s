# The realm hgd1: settings, groups, and the apps' clients and roles.
# People are not in here: accounts and group membership are made in the
# admin console. keycloak-config-cli applies this on every change; groups,
# roles and clients it manages are removed when deleted here.
realm: hgd1
enabled: true
displayName: buunk
loginTheme: flatwork
emailTheme: flatwork
rememberMe: true
registrationAllowed: false
resetPasswordAllowed: true
verifyEmail: true
loginWithEmailAllowed: true
duplicateEmailsAllowed: false
sslRequired: external
bruteForceProtected: true
failureFactor: 10
passwordPolicy: "length(12) and notUsername and notEmail"
# Mail through Migadu, buunk.org's mail provider (SPF, DKIM and DMARC are
# set there), as the mailbox auth@: people know the site as auth.buunk.org,
# not as Keycloak. Password from the Secret keycloak-smtp.
smtpServer:
  host: smtp.migadu.com
  port: "465"
  ssl: "true"
  starttls: "false"
  auth: "true"
  user: auth@buunk.org
  password: $(env:KEYCLOAK_SMTP_PASSWORD)
  from: auth@buunk.org
  fromDisplayName: buunk Account
# The user profile: Keycloak 26's default attributes, plus picture. This
# block is the whole profile, so the defaults are written out: one left out
# here would be removed. picture is the https:// address of the person's
# profile picture. Only admins may set it (the hub, through its service
# account); people see it, and the profile scope puts it in tokens as the
# claim picture, so other apps (Cloudreve) can show it.
# keycloak-config-cli 6.5 only applies userProfile when this (pre-Keycloak
# 24) realm attribute is set; Keycloak itself ignores it.
attributes:
  userProfileEnabled: "true"
userProfile:
  attributes:
    - name: username
      displayName: ${username}
      validations:
        length: { min: 3, max: 255 }
        username-prohibited-characters: {}
        up-username-not-idn-homograph: {}
      permissions: { view: [admin, user], edit: [admin, user] }
      multivalued: false
    - name: email
      displayName: ${email}
      validations:
        email: {}
        length: { max: 255 }
      required: { roles: [user] }
      permissions: { view: [admin, user], edit: [admin, user] }
      multivalued: false
    - name: firstName
      displayName: ${firstName}
      validations:
        length: { max: 255 }
        person-name-prohibited-characters: {}
      required: { roles: [user] }
      permissions: { view: [admin, user], edit: [admin, user] }
      multivalued: false
    - name: lastName
      displayName: ${lastName}
      validations:
        length: { max: 255 }
        person-name-prohibited-characters: {}
      required: { roles: [user] }
      permissions: { view: [admin, user], edit: [admin, user] }
      multivalued: false
    - name: picture
      displayName: Profile picture
      validations:
        uri: {}
        pattern: { pattern: "^https://.+", error-message: "The picture must be an https:// address." }
        length: { max: 2048 }
      permissions: { view: [admin, user], edit: [admin] }
      multivalued: false
  groups:
    - name: user-metadata
      displayHeader: User metadata
      displayDescription: Attributes, which refer to user metadata
# Which group gets which app role. People join groups in the admin console.
groups:
  - name: admins
    clientRoles:
      cloudreve: [cloudreve-admin]
      cloudflare-zero-trust: [warp]
  - name: family
    clientRoles:
      cloudreve: [cloudreve-user]
      cloudflare-zero-trust: [warp]
  - name: friends
    clientRoles:
      cloudreve: [cloudreve-user]
roles:
  client:
    cloudreve:
      # Named after the app so a role mapping reads as what it grants.
      - name: cloudreve-admin
        description: Administrator in Cloudreve (Cloudreve group Admin), not in Keycloak
      - name: cloudreve-user
        description: User in Cloudreve (Cloudreve group User)
    cloudflare-zero-trust:
      - name: warp
        description: May connect a device to WARP (internal apps); not the admin network
clients:
  # Cloudreve (https://cloudreve.buunk.org, repo hgd1-cloudreve): login
  # through its OIDC patch. The roles go into the ID token as "roles"; a
  # person without one can't sign in. The secret comes from
  # client-cloudreve.sops.yaml.
  - clientId: cloudreve
    name: Cloudreve
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: $(env:CLOUDREVE_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    frontchannelLogout: false
    rootUrl: https://cloudreve.buunk.org
    baseUrl: /
    redirectUris:
      - https://cloudreve.buunk.org/api/v4/session/oidc/callback
    webOrigins: []
    attributes:
      pkce.code.challenge.method: S256
    defaultClientScopes: [basic, profile, email]
    optionalClientScopes: []
    protocolMappers:
      - name: roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          usermodel.clientRoleMapping.clientId: cloudreve
          claim.name: roles
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "false"
          userinfo.token.claim: "false"
          introspection.token.claim: "false"
  # buunk-hub (https://hub.buunk.org, repo buunk-hub): the people hub. The
  # server does the login and keeps the tokens. It shows each person the
  # apps they have a role for, so every client's roles go into its ID token
  # as resource_access (it has no roles of its own). offline_access: its
  # sessions last 30 days and it re-reads the roles hourly, longer than the
  # SSO session lives. Its service account may manage users (users below),
  # used only to set a person's picture. The secret comes from
  # client-hub.sops.yaml.
  - clientId: hub
    name: buunk hub
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: $(env:HUB_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    frontchannelLogout: false
    rootUrl: https://hub.buunk.org
    baseUrl: /
    redirectUris:
      - https://hub.buunk.org/auth/callback
    webOrigins: []
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: https://hub.buunk.org/auth/signed-out
    # roles: client roles in its access token, which the admin API needs
    # for the service account; service_account: Keycloak adds it to clients
    # with a service account, so it is listed rather than removed each run.
    defaultClientScopes: [basic, profile, email, roles, service_account]
    # kc-admin-api: the admin API's audience, asked for only in the service
    # account's token (Keycloak 26.8 refuses admin calls without it).
    optionalClientScopes: [offline_access, kc-admin-api]
    protocolMappers:
      - name: client roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          claim.name: resource_access.${client_id}.roles
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "false"
          userinfo.token.claim: "false"
          introspection.token.claim: "false"
  # Cloudflare Zero Trust (team buunk): signing in to WARP with a buunk
  # account. Cloudflare lets a device enrol only with the role warp; the
  # groups go along as the claim "groups" for Gateway rules per app
  # (identity.oidc_claims "groups=family"). My own WARP login and the admin
  # network stay on Cloudflare's one-time PIN, not on this. The secret comes
  # from client-cloudflare-zero-trust.sops.yaml.
  - clientId: cloudflare-zero-trust
    name: WARP
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: $(env:CLOUDFLARE_ZT_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    frontchannelLogout: false
    redirectUris:
      - https://buunk.cloudflareaccess.com/cdn-cgi/access/callback
    webOrigins: []
    attributes:
      pkce.code.challenge.method: S256
    defaultClientScopes: [basic, profile, email]
    optionalClientScopes: []
    protocolMappers:
      - name: roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          usermodel.clientRoleMapping.clientId: cloudflare-zero-trust
          claim.name: roles
          jsonType.label: String
          multivalued: "true"
          id.token.claim: "true"
          access.token.claim: "false"
          userinfo.token.claim: "false"
          introspection.token.claim: "false"
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        config:
          claim.name: groups
          full.path: "false"
          id.token.claim: "true"
          access.token.claim: "false"
          userinfo.token.claim: "false"
          introspection.token.claim: "false"
# Service accounts. Not people: an app's own login, with only the roles it
# needs. The hub's sets the picture attribute (manage-users is the smallest
# realm-management role that can write a user).
users:
  - username: service-account-hub
    enabled: true
    serviceAccountClientId: hub
    clientRoles:
      realm-management: [manage-users]
