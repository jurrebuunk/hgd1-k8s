# Only cloudflared's exact-root route reaches this server. Never proxy to
# Keycloak's admin hostname, and never derive the redirect target from input.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
    # Explicit paths because the root filesystem is read-only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    access_log /dev/stdout;
    server_tokens off;
    server {
        listen 8080;
        server_name _;
        add_header Cache-Control "no-store" always;
        # The hub (buunk-hub) is where people manage their account now; it
        # signs them in through this Keycloak.
        location = / {
            return 302 https://hub.buunk.org/;
        }
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }
        location / {
            return 404;
        }
    }
}
