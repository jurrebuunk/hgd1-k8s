# Only cloudflared's exact-root route reaches this server. Never proxy to
# Keycloak's admin hostname, and never derive the redirect target from input.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
    access_log /dev/stdout;
    server_tokens off;
    server {
        listen 8080;
        server_name _;
        add_header Cache-Control "no-store" always;
        location = / {
            return 302 https://auth.buunk.org/realms/hgd1/account/;
        }
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }
        location / {
            return 404;
        }
    }
}
