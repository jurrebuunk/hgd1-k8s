# Keycloak's own / redirects to its private admin hostname (localhost).
# The public tunnel sends only the exact root here; realm traffic still goes
# directly to Keycloak and /admin + /realms/master stay blocked at the tunnel.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-root-redirect
spec:
  replicas: 2
  selector:
    matchLabels: { app: keycloak-root-redirect }
  template:
    metadata:
      labels: { app: keycloak-root-redirect }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: keycloak-root-redirect }
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redirect
          # nginx 1.30.6, pinned to the tested stable-alpine image.
          image: nginxinc/nginx-unprivileged:stable-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
          command: [nginx]
          args: [-g, "daemon off;"]
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: keycloak-root-redirect }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-root-redirect
spec:
  selector: { app: keycloak-root-redirect }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak-root-redirect
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: keycloak-root-redirect }
