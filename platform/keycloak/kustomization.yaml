apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
resources:
  - database.yaml
  - bootstrap-admin.sops.yaml
  - bootstrap-service.sops.yaml
  - keycloak.yaml
  - root-redirect.yaml
  - networkpolicy.yaml
components:
  - ../../components/postgres
  - ../../components/egress/default
# The login theme flatwork (theme/), mounted into Keycloak by keycloak.yaml.
configMapGenerator:
  - name: keycloak-root-redirect
    files: [nginx.conf=root-redirect.conf]
  - name: keycloak-theme
    files:
      - theme/theme.properties
      - theme/template.ftl
      - theme/login.ftl
      - theme/login-otp.ftl
      - theme/login-reset-password.ftl
      - theme/info.ftl
      - theme/binary.ftl
      - theme/messages_en.properties
      - theme/messages_nl.properties
      - theme/flatwork.css
      - theme/auth.css
      - theme/auth.js
      - theme/favicon.svg
      - theme/geist-400.woff2
      - theme/geist-500.woff2
      - theme/geist-600.woff2
      - theme/plex-mono-400.woff2
configurations:
  - kustomizeconfig.yaml
