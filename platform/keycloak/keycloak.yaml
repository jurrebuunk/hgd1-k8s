# Logins for public apps (plan step 6) at https://auth.buunk.org, realm hgd1.
# Cloudflare terminates TLS and cloudflared forwards plain HTTP with
# X-Forwarded headers. The admin console is not public (the tunnel answers
# 404 for /admin and the master realm); reach it with
#   kubectl -n keycloak port-forward svc/keycloak-service 8080
# and http://localhost:8080/admin/.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
spec:
  instances: 2
  db:
    vendor: postgres
    host: keycloak-db-rw
    database: keycloak
    usernameSecret: { name: keycloak-db-app, key: username }
    passwordSecret: { name: keycloak-db-app, key: password }
  http:
    httpEnabled: true
  hostname:
    hostname: https://auth.buunk.org
    admin: http://localhost:8080
    backchannelDynamic: true
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  bootstrapAdmin:
    user: { secret: keycloak-bootstrap-admin }
    service: { secret: keycloak-config-cli }
  scheduling:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels: { app: keycloak }
  resources:
    requests: { cpu: 100m, memory: 640Mi }
    limits: { memory: 1Gi }
  # The theme flatwork (login and email) from the config map keycloak-theme.
  unsupported:
    podTemplate:
      spec:
        containers:
          - volumeMounts:
              - { name: theme-flatwork, mountPath: /opt/keycloak/themes/flatwork, readOnly: true }
        volumes:
          - name: theme-flatwork
            configMap:
              name: keycloak-theme
              items:
                - { key: theme.properties, path: login/theme.properties }
                - { key: template.ftl, path: login/template.ftl }
                - { key: login.ftl, path: login/login.ftl }
                - { key: login-otp.ftl, path: login/login-otp.ftl }
                - { key: login-reset-password.ftl, path: login/login-reset-password.ftl }
                - { key: info.ftl, path: login/info.ftl }
                - { key: binary.ftl, path: login/binary.ftl }
                - { key: messages_en.properties, path: login/messages/messages_en.properties }
                - { key: messages_nl.properties, path: login/messages/messages_nl.properties }
                - { key: flatwork.css, path: login/resources/css/flatwork.css }
                - { key: auth.css, path: login/resources/css/auth.css }
                - { key: auth.js, path: login/resources/js/auth.js }
                - { key: favicon.svg, path: login/resources/img/favicon.svg }
                - { key: geist-400.woff2, path: login/resources/fonts/geist-400.woff2 }
                - { key: geist-500.woff2, path: login/resources/fonts/geist-500.woff2 }
                - { key: geist-600.woff2, path: login/resources/fonts/geist-600.woff2 }
                - { key: plex-mono-400.woff2, path: login/resources/fonts/plex-mono-400.woff2 }
                - { key: email-theme.properties, path: email/theme.properties }
                - { key: email-template.ftl, path: email/html/template.ftl }
                - { key: email-password-reset.ftl, path: email/html/password-reset.ftl }
                - { key: email-email-verification.ftl, path: email/html/email-verification.ftl }
                - { key: email-executeActions.ftl, path: email/html/executeActions.ftl }
                - { key: email-email-update-confirmation.ftl, path: email/html/email-update-confirmation.ftl }
                - { key: email-messages_en.properties, path: email/messages/messages_en.properties }
                - { key: email-messages_nl.properties, path: email/messages/messages_nl.properties }
