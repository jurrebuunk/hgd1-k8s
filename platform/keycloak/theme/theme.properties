# React components are compiled into these server-rendered Keycloak templates.
parent=base
import=common/keycloak
styles=css/flatwork.css css/auth.css
meta=viewport==width=device-width,initial-scale=1
# The handoff is dark by default. Also supports light or system.
fwColorMode=dark

# Base-theme pages (required actions, WebAuthn, recovery, errors) use the same
# Flatwork library classes and shared auth layout as the three custom screens.
kcBodyClass=auth-body
kcFormClass=auth-form
kcFormGroupClass=fw-group
kcLabelClass=fw-label
kcInputClass=fw-input
kcInputGroup=fw-input-affix
kcInputErrorMessageClass=fw-field-error
kcInputHelperTextBeforeClass=fw-help
kcInputHelperTextAfterClass=fw-help
kcInputClassRadio=fw-radio
kcInputClassCheckbox=fw-checkbox
kcCheckboxInputClass=fw-checkbox
kcSelectClass=fw-input
kcFormOptionsClass=fw-options
kcFormOptionsWrapperClass=fw-options-end
kcFormSettingClass=fw-options
kcFormButtonsClass=fw-actions
kcButtonClass=fw-btn
kcButtonPrimaryClass=fw-btn-primary
kcButtonSecondaryClass=fw-btn-secondary
kcButtonDefaultClass=fw-btn-secondary
kcButtonBlockClass=fw-btn-block
kcButtonLargeClass=fw-btn-lg
kcFormPasswordVisibilityButtonClass=fw-btn fw-btn-ghost fw-btn-icon
kcFormPasswordVisibilityIconShow=fw-icon fw-icon-eye
kcFormPasswordVisibilityIconHide=fw-icon fw-icon-eye-off
kcAlertClass=fw-alert
kcAlertTitleClass=fw-alert-text
kcSelectAuthListClass=fw-choice-list
kcSelectAuthListItemClass=fw-choice
kcSelectAuthListItemIconClass=fw-hidden
kcSelectAuthListItemBodyClass=fw-choice-body
kcSelectAuthListItemHeadingClass=fw-t-heading
kcSelectAuthListItemDescriptionClass=fw-help
kcSelectAuthListItemArrowClass=fw-hidden
kcSelectAuthListItemFillClass=fw-hidden
