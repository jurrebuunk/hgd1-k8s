# flatwork: the login theme for buunk.org (flatwork-saas design language).
# Built on Keycloak's base theme (plain HTML, no PatternFly): template.ftl and
# login.ftl are our own, the other pages use base's templates with the
# classes mapped below, all styled by css/flatwork.css.
parent=base
import=common/keycloak

styles=css/flatwork.css
meta=viewport==width=device-width,initial-scale=1

# Shown in the top bar and footer.
fwBrand=buunk
fwHostname=auth.buunk.org
# Footer links, "Label==URL" separated by spaces; empty: none.
fwFooterLinks=

kcHtmlClass=fw
kcBodyClass=fw-body
kcLoginClass=fw-page
kcHeaderClass=fw-hidden
kcFormCardClass=fw-card
kcFormHeaderClass=fw-card-header

kcFormGroupClass=fw-group
kcLabelWrapperClass=fw-label-wrapper
kcLabelClass=fw-label
kcInputWrapperClass=fw-input-wrapper
kcInputClass=fw-input
kcInputGroup=fw-input-group
kcInputErrorMessageClass=fw-field-error
kcInputHelperTextBeforeClass=fw-help
kcInputHelperTextAfterClass=fw-help
kcInputClassRadio=fw-radio
kcInputClassCheckbox=fw-checkbox
kcCheckboxInputClass=fw-checkbox
kcSelectClass=fw-input

kcFormSettingClass=fw-options
kcFormOptionsClass=fw-options
kcFormOptionsWrapperClass=fw-options-end
kcFormButtonsClass=fw-actions
kcFormButtonsWrapperClass=fw-actions-wrapper

kcButtonClass=fw-btn
kcButtonPrimaryClass=fw-btn-primary
kcButtonSecondaryClass=fw-btn-secondary
kcButtonDefaultClass=fw-btn-secondary
kcButtonBlockClass=fw-btn-block
kcButtonLargeClass=

kcFormPasswordVisibilityButtonClass=fw-reveal
kcFormPasswordVisibilityIconShow=fw-icon fw-icon-eye
kcFormPasswordVisibilityIconHide=fw-icon fw-icon-eye-off

kcAlertClass=fw-alert
kcAlertTitleClass=fw-alert-text
kcFeedbackErrorIcon=fw-icon fw-icon-alert
kcFeedbackWarningIcon=fw-icon fw-icon-alert
kcFeedbackSuccessIcon=fw-icon fw-icon-check
kcFeedbackInfoIcon=fw-icon fw-icon-info
kcResetFlowIcon=fw-icon fw-icon-restart

kcFormSocialAccountSectionClass=fw-social
kcFormSocialAccountListClass=fw-social-list
kcFormSocialAccountListGridClass=fw-social-list
kcFormSocialAccountListButtonClass=fw-btn fw-btn-secondary
kcFormSocialAccountGridItem=
kcFormSocialAccountNameClass=fw-social-name
kcFormSocialAccountListButtonDisabledClass=fw-disabled

kcSignUpClass=fw-below
kcInfoAreaWrapperClass=fw-below-wrapper
kcContentWrapperClass=fw-content

kcLocaleMainClass=fw-locale
kcLocaleWrapperClass=fw-locale-wrapper
kcLocaleDropDownClass=fw-locale-dropdown
kcLocaleListClass=fw-menu
kcLocaleListItemClass=fw-menu-item
kcLocaleItemClass=fw-menu-link

kcSelectAuthListClass=fw-choice-list
kcSelectAuthListItemClass=fw-choice
kcSelectAuthListItemIconClass=fw-hidden
kcSelectAuthListItemBodyClass=fw-choice-body
kcSelectAuthListItemHeadingClass=fw-choice-title
kcSelectAuthListItemDescriptionClass=fw-choice-text
kcSelectAuthListItemArrowClass=fw-hidden
kcSelectAuthListItemFillClass=fw-hidden
