# Let's Encrypt for the internal apps (plan step 10): DNS-01 on buunk.org
# through Cloudflare, since internal names have no public record. One
# certificate per app (_acme-challenge.<app>.buunk.org); not a wildcard:
# _acme-challenge.buunk.org already points to acme-dns for something else.
# Use letsencrypt-staging to try a new app, then letsencrypt.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef: { name: letsencrypt-staging-account }
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef: { name: cloudflare-dns-token, key: api-token }
        selector:
          dnsZones: [buunk.org]
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef: { name: letsencrypt-account }
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef: { name: cloudflare-dns-token, key: api-token }
        selector:
          dnsZones: [buunk.org]
