# A test page for the tunnel (plan step 3): https://test.buunk.org.
apiVersion: v1
kind: Namespace
metadata:
  name: test-page
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: test-page
spec:
  replicas: 2
  selector:
    matchLabels: { app: whoami }
  template:
    metadata:
      labels: { app: whoami }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: whoami }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          args: [--port, "8080"]
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: test-page
spec:
  selector: { app: whoami }
  ports: [{ port: 80, targetPort: 8080 }]
