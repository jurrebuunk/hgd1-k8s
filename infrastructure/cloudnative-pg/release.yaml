# Postgres for apps (plan step 4): the CloudNativePG operator and its Barman
# Cloud plugin, which backs every cluster up to the S3 bucket pg-backups.
# An app gets a database with a Cluster and components/postgres.
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  url: https://cloudnative-pg.github.io/charts
  interval: 12h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.1 # operator 1.30.1
      sourceRef: { kind: HelmRepository, name: cnpg }
  install: { remediation: { retries: 3 } }
  upgrade: { remediation: { retries: 3 } }
  values:
    resources: { requests: { cpu: 20m, memory: 96Mi } }
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: cnpg-system
spec:
  interval: 1h
  dependsOn:
    - { name: cloudnative-pg }
    - { name: cert-manager, namespace: cert-manager }
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.9.0 # plugin v0.16.0
      sourceRef: { kind: HelmRepository, name: cnpg }
  install: { remediation: { retries: 3 } }
  upgrade: { remediation: { retries: 3 } }
