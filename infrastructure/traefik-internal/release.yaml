# The internal Traefik (plan step 10): HTTPS for internal apps, reached only
# through the tunnel hgd1-internal (ClusterIP, no load balancer, no LAN
# address). Apps use an Ingress with ingressClassName: internal and a
# cert-manager certificate; HTTP redirects to HTTPS and every HTTPS
# response carries HSTS.
apiVersion: v1
kind: Namespace
metadata:
  name: traefik-internal
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: { name: traefik, namespace: traefik-internal }
spec: { url: https://traefik.github.io/charts, interval: 12h }
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: { name: traefik-internal, namespace: traefik-internal }
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: 42.4.0 # Traefik v3.7.18
      sourceRef: { kind: HelmRepository, name: traefik }
  install: { crds: CreateReplace, remediation: { retries: 3 } }
  upgrade: { crds: CreateReplace, remediation: { retries: 3 } }
  values:
    fullnameOverride: traefik-internal
    deployment:
      replicas: 2
      podAnnotations: { prometheus.io/scrape: "true", prometheus.io/port: "9100" }
    podDisruptionBudget: { enabled: true, minAvailable: 1 }
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels: { app.kubernetes.io/name: traefik, app.kubernetes.io/instance: traefik-internal-traefik-internal }
    ingressClass: { enabled: true, isDefaultClass: false, name: internal }
    providers:
      kubernetesIngress: { enabled: true, ingressClass: internal, allowExternalNameServices: false }
      kubernetesCRD: { enabled: true, ingressClass: internal, allowCrossNamespace: false, allowExternalNameServices: false }
      kubernetesGateway: { enabled: false }
    gateway: { enabled: false }
    gatewayClass: { enabled: false }
    ingressRoute: { dashboard: { enabled: false } }
    service: { spec: { type: ClusterIP } } # never a LoadBalancer: only the tunnel reaches it
    ports:
      web:
        http:
          redirections:
            entryPoint: { to: websecure, scheme: https, permanent: true }
      websecure:
        http:
          middlewares: [traefik-internal-hsts@kubernetescrd]
          tls: { enabled: true }
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }
    # HSTS for every internal app, like the public ones get from Cloudflare.
    extraObjects:
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata: { name: hsts, namespace: traefik-internal }
        spec:
          headers: { stsSeconds: 31536000, forceSTSHeader: true }
