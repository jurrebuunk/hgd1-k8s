# The tunnel's routes: publishing an app is a line here plus its DNS record
# (a proxied CNAME <name>.buunk.org → <tunnel id>.cfargotunnel.com). A
# wildcard record isn't possible: *.buunk.org has MX records.
tunnel: 464b884a-410d-4066-8946-0532c41f1978 # hgd1-apps
credentials-file: /etc/cloudflared/credentials/credentials.json
ingress:
  # Keycloak: logins for the hgd1 realm only; the admin console and the
  # master realm are not public (kubectl port-forward instead).
  - hostname: auth.buunk.org
    path: ^/(admin|realms/master)(/.*)?$
    service: http_status:404
  # Keycloak's / points at its private admin URL. Only the exact root goes
  # to this fixed redirect to the hub; realm/API traffic is unchanged.
  - hostname: auth.buunk.org
    path: ^/$
    service: http://keycloak-root-redirect.keycloak.svc.cluster.local:8080
  # The account console (UI and its API) is replaced by the hub: the same
  # redirect pods send it to https://hub.buunk.org/.
  - hostname: auth.buunk.org
    path: ^/realms/hgd1/account(/.*)?$
    service: http://keycloak-root-redirect.keycloak.svc.cluster.local:8080
  - hostname: auth.buunk.org
    service: http://keycloak-service.keycloak.svc.cluster.local:8080
  # Cloudreve (hgd1-cloudreve): the web app, its own accounts.
  - hostname: cloudreve.buunk.org
    service: http://cloudreve.cloudreve.svc.cluster.local:80
  # Cloudreve's bucket for browsers (signed links), through its gateway
  # (hgd1-cloudreve: only the bucket cloudreve, Host kept). 404 here for
  # anything outside the bucket as well.
  - hostname: files-s3.buunk.org
    path: ^/cloudreve(/.*)?$
    service: http://s3-gateway.cloudreve.svc.cluster.local:80
  - hostname: files-s3.buunk.org
    service: http_status:404
  # buunk-hub: the people hub; everything behind its own sign-in.
  - hostname: hub.buunk.org
    service: http://hub.hub.svc.cluster.local:80
  - service: http_status:404
