# Volumes on a node's own NVMe, for databases that replicate themselves
# (CloudNativePG). Same StorageClass name, provisioner name and data path as
# the copy k3s shipped before, so nothing that uses it has to change.
apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  url: https://github.com/rancher/local-path-provisioner
  ref:
    tag: v0.0.37
  interval: 12h
  ignore: |
    /*
    !/deploy/chart/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  interval: 1h
  chart:
    spec:
      chart: ./deploy/chart/local-path-provisioner
      sourceRef:
        kind: GitRepository
        name: local-path-provisioner
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    storageClass:
      name: local-path
      provisionerName: rancher.io/local-path
      defaultClass: true
      reclaimPolicy: Delete
      volumeBindingMode: WaitForFirstConsumer
    nodePathMap:
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths: ["/var/lib/rancher/k3s/storage"]
    resources:
      requests: { cpu: 10m, memory: 32Mi }
