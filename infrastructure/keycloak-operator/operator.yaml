# The Keycloak operator (plan step 6), from Keycloak's own release manifests.
# It runs in, and only watches, the namespace keycloak.
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: keycloak-k8s-resources
  namespace: flux-system
spec:
  url: https://github.com/keycloak/keycloak-k8s-resources
  ref:
    tag: "26.8.2"
  interval: 12h
  ignore: |
    /*
    !/kubernetes/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-operator
  namespace: flux-system
spec:
  interval: 1h
  sourceRef: { kind: GitRepository, name: keycloak-k8s-resources }
  path: ./kubernetes
  prune: true
  wait: true
  timeout: 5m
