# Certificates inside the cluster. For now only the TLS of CloudNativePG's
# backup plugin; later also local ingress (DNS-01).
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: cert-manager
spec:
  url: https://charts.jetstack.io
  interval: 12h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: v1.21.3
      sourceRef: { kind: HelmRepository, name: jetstack }
  install: { remediation: { retries: 3 } }
  upgrade: { remediation: { retries: 3 } }
  values:
    crds: { enabled: true, keep: true }
    # DNS-01 (Let's Encrypt for internal apps, config/cert-manager): check
    # the TXT record at public resolvers, not through the router's cache.
    extraArgs: [--dns01-recursive-nameservers-only, "--dns01-recursive-nameservers=1.1.1.1:53,9.9.9.9:53"]
    resources: { requests: { cpu: 10m, memory: 64Mi } }
    webhook: { resources: { requests: { cpu: 10m, memory: 32Mi } } }
    cainjector: { resources: { requests: { cpu: 10m, memory: 64Mi } } }
